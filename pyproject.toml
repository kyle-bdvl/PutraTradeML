[project]
name = "putratrademl"
version = "0.1.0"
description = "To predict the stock market if its going to go UP, DOWN or SIDEWAYS"
readme = "README.md"
authors = [
    { name = "Kyle-bdvl", email = "kyle.boudville@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "ta>=0.11.0",
    "xgboost>=3.4.1",
    "yfinance>=1.7.0",
]

[project.scripts]
putratrademl = "putratrademl:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
